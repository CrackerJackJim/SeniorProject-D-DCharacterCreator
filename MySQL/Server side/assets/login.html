<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Login</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="auth-container">
    <h1>Login</h1>

    <input id="identifier" type="text" placeholder="Username or Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button id="loginBtn">Login</button>

    <button id="forgotPasswordBtn" class="link-button">Forgot Password?</button>

    <button id="guestBtn" class="link-button">Continue as Guest</button>

    <p id="error" class="error"></p>

    <p>
        Don't have an account?
        <a href="/assets/register.html">Register here</a>
    </p>
</div>

<script type="module">
    import { apiRequest } from "/assets/api.js";

    const loginBtn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");

    loginBtn.addEventListener("click", async () => {
        errorEl.textContent = "";

        const identifier = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!identifier || !password) {
            errorEl.textContent = "Please enter both fields.";
            return;
        }

        try {
            const result = await apiRequest("/login", "POST", {
                identifier,
                password
            });

            // Store user info
            localStorage.setItem("user", JSON.stringify({
                id: result.user_id,
                username: result.username,
                email: result.email
            }));

            // ⭐ CRITICAL FIX ⭐
            // This is what your character creation backend requires.
            localStorage.setItem("account_id", result.user_id);

            window.location.href = "/assets/characters.html";

        } catch (err) {
            errorEl.textContent = err.message || "Login failed.";
        }
    });

    document.getElementById("forgotPasswordBtn").addEventListener("click", () => {
        window.location.href = "/assets/password_reset.html";
    });

    document.getElementById("guestBtn").addEventListener("click", () => {
        const tempGuestId = "guest_" + crypto.randomUUID();

        localStorage.setItem("user", JSON.stringify({ guest: true }));
        localStorage.setItem("account_id", tempGuestId);
        localStorage.setItem("is_guest", "true");

        window.location.href = "/assets/characters.html";
    });
</script>

</body>
</html>
