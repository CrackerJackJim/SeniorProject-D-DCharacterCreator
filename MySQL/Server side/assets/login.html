<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Login</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="auth-container">
    <h1>Login</h1>

    <input id="identifier" type="text" placeholder="Username or Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button id="loginBtn">Login</button>

    <button id="forgotPasswordBtn" class="link-button">Forgot Password?</button>

    <button id="guestBtn" class="link-button">Continue as Guest</button>

    <p id="error" class="error"></p>

    <p>
        Don't have an account?
        <a href="/assets/register.html">Register here</a>
    </p>
</div>

<script type="module">
    import { apiRequest } from "/assets/api.js";

    document.getElementById("loginBtn").addEventListener("click", async () => {
        const identifier = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value.trim();

        const result = await apiRequest("/login", "POST", { identifier, password });

        if (!result.user_id) {
            document.getElementById("error").textContent = "Invalid username or password.";
            return;
        }

        localStorage.setItem("user", JSON.stringify(result));
        window.location.href = "/assets/characters.html";
    });

    document.getElementById("forgotPasswordBtn").addEventListener("click", () => {
        window.location.href = "/assets/password_reset.html";
    });

    document.getElementById("guestBtn").addEventListener("click", () => {
        localStorage.setItem("user", JSON.stringify({ guest: true }));
        window.location.href = "/assets/characters.html";
    });
</script>

</body>
</html>
