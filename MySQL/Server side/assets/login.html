<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Login</title>
    <link rel="stylesheet" href="/assets/style.css">

    <style>
        :root { --global-font: 'Firlest'; }

        body {
            font-family: var(--global-font, 'Firlest');
            background-color: #1b1510;
            color: #f5e6c8;
            margin: 0;
        }

        .auth-page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .auth-panel {
            width: 750px;
            max-width: 95%;
            background: url('/assets/images/Selection.jpg') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 24px;
            box-shadow: 0 0 55px rgba(0,0,0,0.75);
            padding: 80px 70px;
            color: #2b1d0f;
        }

        .auth-panel h1 {
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 54px;
            text-align: center;
        }

        .auth-panel input {
            width: 100%;
            padding: 18px;
            margin-bottom: 24px;
            border-radius: 12px;
            border: 3px solid #5a3e1b;
            background: #c8b48a;
            color: #2b1d0f;
            font-size: 26px;
            font-family: var(--global-font), serif;
        }

        .auth-panel button {
            width: 60%;
            padding: 14px 0;
            margin: 20px auto 0;
            display: block;
            border-radius: 12px;
            border: 3px solid #5a3e1b;
            background-color: #c8b48a;
            color: #2b1d0f;
            font-size: 26px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--global-font), serif;
        }

        .auth-panel button:hover {
            background-color: #d6c49a;
        }

        .auth-panel .link-button {
            background-color: transparent;
            border: none;
            color: #2b1d0f;
            text-decoration: underline;
            font-size: 24px;
            padding: 10px 0;
            margin-top: 10px;
        }

        .auth-panel .link-button:hover {
            background-color: transparent;
            color: #3b2612;
        }

        .auth-panel p {
            margin-top: 30px;
            font-size: 22px;
            text-align: center;
            color: #2b1d0f;
        }

        .auth-panel a {
            color: #3b2612;
            text-decoration: underline;
        }

        .auth-panel a:hover {
            color: #1f1207;
        }

        /* ⭐ UPDATED ERROR STYLE — NOT BOLD, but brighter + clearer */
        #error {
            margin-top: 16px;
            font-size: 26px;
            font-weight: 400;                 /* no bold */
            color: #cc0000;                    /* brighter red */
            text-shadow: 0 0 4px rgba(0,0,0,0.5);
            min-height: 32px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="auth-page-wrapper">
    <div class="auth-panel">
        <h1>Login</h1>

        <input id="identifier" type="text" placeholder="Username or Email" required>
        <input id="password" type="password" placeholder="Password" required>

        <!-- ⭐ ERROR DIRECTLY UNDER LOGIN BUTTON -->
        <button id="loginBtn" type="button">Login</button>
        <p id="error"></p>

        <button id="forgotPasswordBtn" type="button" class="link-button">Forgot Password?</button>
        <button id="guestButton" type="button" class="link-button">Continue as Guest</button>

        <p>
            Don't have an account?
            <a href="/assets/register.html">Register here</a>
        </p>
    </div>
</div>

<script type="module">
    import { apiRequest } from "/assets/api.js";

    const loginBtn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");
    const guestBtn = document.getElementById("guestButton");
    const forgotBtn = document.getElementById("forgotPasswordBtn");

    loginBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";

        const identifier = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!identifier || !password) {
            errorEl.textContent = "Please enter both fields.";
            return;
        }

        try {
            const result = await apiRequest("/login", "POST", {
                identifier,
                password
            });

            localStorage.setItem("user", JSON.stringify({
                id: result.user_id,
                username: result.username,
                email: result.email
            }));

            localStorage.setItem("account_id", result.user_id);
            localStorage.removeItem("guest_mode");

            window.location.href = "/assets/characters.html";
        } catch (err) {
            errorEl.textContent = err.message || "Login failed.";
        }
    });

    forgotBtn.addEventListener("click", () => {
        window.location.href = "/assets/password_reset.html";
    });

    guestBtn.addEventListener("click", () => {
        localStorage.setItem("guest_mode", "true");
        localStorage.removeItem("user");
        localStorage.removeItem("account_id");
        window.location.href = "/assets/create_character.html";
    });
</script>

</body>
</html>
