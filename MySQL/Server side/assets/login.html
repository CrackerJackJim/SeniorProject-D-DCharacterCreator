<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Login</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="auth-container">
    <h1>Login</h1>

    <!-- Single correct login form -->
    <input id="identifier" type="text" placeholder="Username or Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button id="loginBtn" type="button">Login</button>
    <button id="forgotPasswordBtn" type="button" class="link-button">Forgot Password?</button>
    <button id="guestButton" type="button" class="link-button">Continue as Guest</button>


    <p id="error" class="error"></p>

    <p>
        Don't have an account?
        <a href="/assets/register.html">Register here</a>
    </p>
</div>

<script type="module">
    import { apiRequest } from "/assets/api.js";

    const loginBtn = document.getElementById("loginBtn");
    const errorEl = document.getElementById("error");
    const guestBtn = document.getElementById("guestButton");
    const forgotBtn = document.getElementById("forgotPasswordBtn");

    // ---------------- LOGIN ----------------
    loginBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";

        const identifier = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!identifier || !password) {
            errorEl.textContent = "Please enter both fields.";
            return;
        }

        try {
            const result = await apiRequest("/login", "POST", {
                identifier,
                password
            });

            localStorage.setItem("user", JSON.stringify({
                id: result.user_id,
                username: result.username,
                email: result.email
            }));

            localStorage.setItem("account_id", result.user_id);
            localStorage.removeItem("guest_mode");

            window.location.href = "/assets/characters.html";
        } catch (err) {
            errorEl.textContent = err.message || "Login failed.";
        }
    });

    // ---------------- FORGOT PASSWORD ----------------
    forgotBtn.addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = "/assets/password_reset.html";
    });

    // ---------------- GUEST MODE ----------------
    guestBtn.addEventListener("click", (e) => {
        e.preventDefault();

        // Mark user as guest
        localStorage.setItem("guest_mode", "true");

        // Remove any leftover account data
        localStorage.removeItem("user");
        localStorage.removeItem("account_id");

        // Go directly to character creation
        console.log("Guest button clicked → going to create_character.html");
        window.location.href = "/assets/create_character.html";
    });
</script>

</body>
</html>
