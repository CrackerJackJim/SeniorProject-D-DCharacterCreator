<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Login</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="auth-container">
    <h1>Login</h1>

    <input id="identifier" type="text" placeholder="Username or Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button id="loginBtn">Login</button>

    <button id="guestBtn" class="guest-button">Continue as Guest</button>

    <p id="error" class="error"></p>

    <p>
        Don't have an account?
        <a href="/assets/register.html">Register here</a>
    </p>
</div>

<script type="module" src="/assets/api.js"></script>
<script type="module" src="/assets/auth.js"></script>

</body>
</html>
