<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Character Selection</title>
    <link rel="stylesheet" href="style.css?v=9">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'PfefferMediaeval', serif;
            background: url('images/full_paper_background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #2b1d0f;
        }

        .book-container {
            width: 100%;
            max-width: 1600px;
            min-width: 1000px;
            aspect-ratio: 16 / 9;

            background: url('images/Book_menu_background.png') no-repeat center center;
            background-size: 110% 110%;

            padding: 100px 80px;
            margin: 60px auto;

            display: flex;
            box-sizing: border-box;

            filter: drop-shadow(0px 20px 40px rgba(0, 0, 0, 0.55));
        }

        .left-side {
            width: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .left-side h1 {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .left-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;

            margin-left: 220px;   /* pushes buttons further right */
            margin-top: -60px;    /* pulls buttons upward */
        }

        .left-side button {
            width: 60%;
            min-width: 220px;
            max-width: 380px;
            padding: 12px;
            font-size: 20px;
            background-color: #8b5a2b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'PfefferMediaeval', serif;
            transition: background-color 0.3s ease;
        }

        .left-side button:hover {
            background-color: #a9743a;
        }

        .right-side {
            width: 60%;
            max-height: 600px;
            overflow-y: auto;
            padding-left: 20px;
        }

        .right-title {
            font-size: 42px;
            text-align: center;
            margin-bottom: 30px;
        }
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            width: 100%;
        }

        .character-card {
            background: url('images/Character_Card_Background.png') no-repeat center center;
            background-size: 100% 100%;
            padding: 40px;
            height: 350px;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-family: 'PfefferMediaeval', serif;
            color: #2b1d0f;
        }


        #logoutBtn {
            width: 60%;
            min-width: 220px;
            max-width: 380px;
            padding: 12px;
            font-size: 20px;
            background-color: #8b5a2b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'PfefferMediaeval', serif;
            transition: background-color 0.3s ease;
        }

        #logoutBtn:hover {
            background-color: #a9743a;
        }

        .character-card:hover {
            transform: scale(1.03);
        }

        .card-content h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .card-content p {
            font-size: 22px;
            margin: 4px 0;
        }

        .no-characters {
            font-size: 24px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="book-container">

    <!-- LEFT PAGE -->
    <div class="left-side">
        <div class="left-buttons">
            <button id="createBtn">Create New Character</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <!-- RIGHT PAGE -->
    <div class="right-side">
        <h1 class="right-title">Your Characters</h1>
        <div id="characterGrid">
            <p class="no-characters">Loading characters...</p>
        </div>
    </div>

</div>

<script type="module">
    import { apiRequest } from "./api.js";

    const user = JSON.parse(localStorage.getItem("user"));
    if (!user || user.guest) {
        window.location.href = "create_character.html";
    }

    const grid = document.getElementById("characterGrid");
    const createBtn = document.getElementById("createBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function daysSince(dateString) {
        const then = new Date(dateString);
        const now = new Date();
        const diff = now - then;
        return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    async function loadCharacters() {
        try {
            let characters = await apiRequest(`/characters/${user.id}`, "GET");

            if (!characters || characters.length === 0) {
                grid.innerHTML = `<p class="no-characters">No Created Characters</p>`;
                return;
            }

            characters.sort((a, b) => new Date(b.last_edited) - new Date(a.last_edited));
            grid.className = "character-grid";
            grid.innerHTML = "";

            characters.forEach(char => {
                const days = daysSince(char.last_edited);

                const card = document.createElement("div");
                card.className = "character-card";

                card.innerHTML = `
                    <div class="card-content">
                        <h2>${char.name}</h2>
                        <p><strong>Level:</strong> ${char.level}</p>
                        <p><strong>Class:</strong> ${char.class}</p>
                        <p><strong>Race:</strong> ${char.race}</p>
                        <p><strong>Gender:</strong> ${char.gender}</p>
                        <p><strong>Created:</strong> ${new Date(char.created_at).toLocaleDateString()}</p>
                        <p><strong>Last Edited:</strong> ${days} day(s) ago</p>
                    </div>
                `;

                card.addEventListener("click", async () => {
                    await apiRequest(`/characters/${char.id}/touch`, "POST");
                    window.location.href = `character_sheet.html?id=${char.id}`;
                });

                grid.appendChild(card);
            });

        } catch (err) {
            grid.innerHTML = `<p class="no-characters">Failed to load characters.</p>`;
        }
    }

            logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("user");
            window.location.href = "login.html";
        });

    loadCharacters();

    createBtn.addEventListener("click", () => {
        window.location.href = "create_character.html";
    });
</script>

</body>
</html>
