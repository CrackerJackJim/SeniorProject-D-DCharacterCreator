<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Character</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        :root { --global-font: 'Firlest'; }

        body {
            font-family: var(--global-font, 'Firlest');
            background-color: #1b1510;
            color: #f5e6c8;
            margin: 0;
        }

        .taskbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 10px;
            background: #2a2118;
            border-bottom: 1px solid #4a3a28;
        }

        .taskbar-buttons button {
            background-color: #c8b48a;
            border: 2px solid #5a3e1b;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 18px;
            color: #2b1d0f;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--global-font), serif;
        }

        .taskbar-buttons button:hover {
            background-color: #d6c49a;
        }

        .page-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 10px 40px;
        }

        .creator-panel {
            background: url('/assets/images/Selection.jpg') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            color: #2b1d0f;
        }

        .creator-panel h2 {
            margin-top: 0;
        }

        .creator-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 20px;
        }

        .creator-grid label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .creator-grid input,
        .creator-grid select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #5a3e1b;
            background: #c8b48a;
            color: #2b1d0f;
            font-size: 18px;
            font-family: var(--global-font), serif;
        }

        .ability-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px 12px;
            margin-top: 10px;
        }

        .ability-row > div {
            display: flex;
            flex-direction: column;
        }

        .creator-actions {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .creator-actions button {
            background-color: #c8b48a;
            border: 2px solid #5a3e1b;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 18px;
            color: #2b1d0f;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--global-font), serif;
        }

        .creator-actions button:hover {
            background-color: #d6c49a;
        }

        .sheet-panel {
            width: 100%;
            max-width: 1800px;
            margin: 40px auto;
            padding: 80px;
            background: url('/assets/images/Selection.jpg') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
            min-height: 1100px;
            color: #0e0a05 !important;
            font-size: 24px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .sheet-header h2 {
            margin: 0;
        }

        .sheet-subtitle {
            font-size: 14px;
            opacity: 0.85;
        }

        /* Tabs */
        .sheet-tabs {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            border-bottom: 1px solid #4a3a28;
            padding-bottom: 4px;
        }

        .sheet-tab {
            background-color: #c8b48a;
            border: 2px solid #5a3e1b;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            padding: 10px 20px;
            font-size: 18px;
            color: #2b1d0f;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--global-font), serif;
        }

        .sheet-tab.active {
            background-color: #8b5a2b;
            color: #fffbe8;
            border-color: #3e2a14;
        }

        .sheet-tab-content {
            margin-top: 10px;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .tab-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 20px;
        }

        .tab-grid label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .tab-grid input,
        .tab-grid select,
        .tab-grid textarea {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #5a3e1b;
            background: #c8b48a;
            color: #2b1d0f;
            font-size: 18px;
            font-family: var(--global-font), serif;
        }

        .tab-grid textarea {
            min-height: 80px;
            resize: vertical;
        }

        .abilities-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px 12px;
        }

        .ability-edit-box {
            background: #c8b48a;
            border: 2px solid #5a3e1b;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            color: #2b1d0f;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.25);
        }

        .ability-edit-box .ability-name {
            font-size: 12px;
            opacity: 0.9;
        }

        .ability-edit-box input {
            width: 60px;
            text-align: center;
            margin-top: 4px;
            background: #c8b48a;
            border: 2px solid #5a3e1b;
            color: #2b1d0f;
            border-radius: 6px;
            padding: 4px;
        }

        .ability-edit-box .ability-mod {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.85;
        }

        .saving-throws-grid,
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 20px;
            margin-top: 16px;
        }

        .saving-throw-row,
        .skill-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .saving-throw-row input[type="checkbox"],
        .skill-row input[type="checkbox"] {
            width: auto;
        }

        .saving-throw-row input[type="number"],
        .skill-row input[type="number"] {
            width: 70px;
            text-align: center;
            padding: 4px 6px;
            border-radius: 6px;
            border: 2px solid #5a3e1b;
            background: #c8b48a;
            color: #2b1d0f;
        }

        .currency-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .currency-grid label {
            font-size: 14px;
        }

        .death-saves {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .death-saves-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .death-saves-row input[type="checkbox"] {
            width: auto;
        }

        .settings-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9000;
        }

        .settings-menu {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9001;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .settings-window {
            width: 500px;
            padding: 40px;
            background: url('/assets/images/Selection.jpg') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        .settings-window h2 {
            margin-top: 0;
            font-size: 36px;
            color: #2b1d0f;
        }

        .settings-button-stack {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #fontList button {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            background-color: #c8b48a;
            border: 2px solid #5a3e1b;
            border-radius: 8px;
            cursor: pointer;
            font-size: 22px;
            color: #2b1d0f;
            transition: background 0.15s;
        }

        #fontList button:hover {
            background-color: #d6c49a;
        }


        .settings-option,
        .settings-exit {
            background-color: #c8b48a;
            border: 2px solid #5a3e1b;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 18px;
            color: #2b1d0f;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--global-font), serif;
        }

        .settings-option:hover,
        .settings-exit:hover {
            background-color: #d6c49a;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body class="character-sheet-body">

    <div id="overlay" class="settings-overlay"></div>

    <div id="settingsMenu" class="settings-menu">
        <div class="settings-window">
            <h2>Settings</h2>

            <div class="settings-button-stack">
                <button class="settings-option" id="openFontMenuBtn">Change Font</button>
                <button class="settings-option" id="logoutBtn2">Logout</button>
                <button class="settings-exit" id="closeSettingsBtn">Close</button>
            </div>
        </div>
    </div>

    <div id="fontMenu" class="settings-menu">
        <div class="settings-window">
            <h2>Select Font</h2>

            <div id="fontList"></div>

            <button class="settings-exit" id="closeFontMenuBtn" style="margin-top:20px;">Close</button>
        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-buttons">
            <button id="backToListBtn">Back to Characters</button>
            <button id="saveCharacterBtn" type="button">Save</button>
            <button id="settingsButton">Settings</button>
        </div>
    </div>

    <div class="page-container">

        <!-- CREATOR PANEL -->
        <div class="creator-panel">
            <h2>Create Character</h2>
            <div class="creator-grid">

                <div>
                    <label for="charNameInput">Name</label>
                    <input type="text" id="charNameInput" placeholder="Enter name...">
                </div>

                <div>
                    <label for="charGenderInput">Gender</label>
                    <input type="text" id="charGenderInput" placeholder="Enter gender...">
                </div>

                <div>
                    <label for="charRaceSelect">Race</label>
                    <select id="charRaceSelect">
                        <option value="">Select Race</option>
                    </select>
                </div>

                <div>
                    <label for="charClassSelect">Class</label>
                    <select id="charClassSelect">
                        <option value="">Select Class</option>
                    </select>
                </div>

                <div>
                    <label for="charBackgroundSelect">Background</label>
                    <select id="charBackgroundSelect">
                        <option value="">Select Background</option>
                    </select>
                </div>

               <div>
                    <label>Feats</label>
                    <div class="feats-toggle-row">
                        <span>Disable</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="enableFeatsToggle" checked>
                            <span class="slider"></span>
                        </label>
                        <span>Enable</span>
                    </div>
                </div>

            </div>

            <h3 style="margin-top:16px;">Ability Scores</h3>
            <div class="ability-row">
                <div>
                    <label for="strInput">Strength</label>
                    <input type="number" id="strInput" min="1" max="20" value="10">
                </div>
                <div>
                    <label for="dexInput">Dexterity</label>
                    <input type="number" id="dexInput" min="1" max="20" value="10">
                </div>
                <div>
                    <label for="conInput">Constitution</label>
                    <input type="number" id="conInput" min="1" max="20" value="10">
                </div>
                <div>
                    <label for="intInput">Intelligence</label>
                    <input type="number" id="intInput" min="1" max="20" value="10">
                </div>
                <div>
                    <label for="wisInput">Wisdom</label>
                    <input type="number" id="wisInput" min="1" max="20" value="10">
                </div>
                <div>
                    <label for="chaInput">Charisma</label>
                    <input type="number" id="chaInput" min="1" max="20" value="10">
                </div>
            </div>

            <div class="creator-actions">
                <button id="createCharacterBtn">Create Character</button>
            </div>
        </div>

        <!-- SHEET PANEL -->
        <div id="sheetWrapper" class="sheet-panel hidden">
            <div class="sheet-header">
                <div>
                    <h2 id="sheetName"></h2>
                    <div class="sheet-subtitle" id="sheetSubtitle"></div>
                </div>
                <div class="sheet-subtitle" id="sheetMeta"></div>
            </div>

            <!-- Tabs -->
            <div class="sheet-tabs">
                <button class="sheet-tab active" data-tab="overview">Overview</button>
                <button class="sheet-tab" data-tab="abilities">Abilities</button>
                <button class="sheet-tab" data-tab="skills">Skills</button>
                <button class="sheet-tab" data-tab="combat">Combat</button>
                <button class="sheet-tab" data-tab="inventory">Inventory</button>
                <button class="sheet-tab" data-tab="spells">Spells</button>
                <button class="sheet-tab" data-tab="feats">Feats & Traits</button>
            </div>

            <div class="sheet-tab-content">

                <!-- OVERVIEW TAB -->
                <div id="tab-overview" class="tab-panel active">
                    <div class="tab-grid">

                        <div>
                            <label for="ovName">Name</label>
                            <input type="text" id="ovName">
                        </div>

                        <div>
                            <label for="ovPlayerName">Player Name</label>
                            <input type="text" id="ovPlayerName">
                        </div>

                        <div>
                            <label for="ovGender">Gender</label>
                            <input type="text" id="ovGender">
                        </div>

                        <div>
                            <label for="ovRace">Race</label>
                            <input type="text" id="ovRace" readonly>
                        </div>

                        <div>
                            <label for="ovClass">Class</label>
                            <input type="text" id="ovClass" readonly>
                        </div>

                        <div>
                            <label for="ovBackground">Background</label>
                            <input type="text" id="ovBackground" readonly>
                        </div>

                        <div>
                            <label for="ovLevel">Level</label>
                            <input type="number" id="ovLevel" min="1">
                        </div>

                        <div>
                            <label for="ovAlignment">Alignment</label>
                            <select id="ovAlignment">
                                <option value="">-- Select Alignment --</option>
                                <option value="1">Lawful Good</option>
                                <option value="2">Neutral Good</option>
                                <option value="3">Chaotic Good</option>
                                <option value="4">Lawful Neutral</option>
                                <option value="5">True Neutral</option>
                                <option value="6">Chaotic Neutral</option>
                                <option value="7">Lawful Evil</option>
                                <option value="8">Neutral Evil</option>
                                <option value="9">Chaotic Evil</option>
                            </select>
                        </div>

                        <div>
                            <label for="ovXP">Experience Points</label>
                            <input type="number" id="ovXP" min="0">
                        </div>

                    </div>
                </div>

                <!-- ABILITIES TAB -->
                <div id="tab-abilities" class="tab-panel">
                    <div class="abilities-grid">
                        <div class="ability-edit-box">
                            <div class="ability-name">STR</div>
                            <input type="number" id="abStr" min="1" max="20">
                            <div class="ability-mod" id="abStrMod"></div>
                        </div>
                        <div class="ability-edit-box">
                            <div class="ability-name">DEX</div>
                            <input type="number" id="abDex" min="1" max="20">
                            <div class="ability-mod" id="abDexMod"></div>
                        </div>
                        <div class="ability-edit-box">
                            <div class="ability-name">CON</div>
                            <input type="number" id="abCon" min="1" max="20">
                            <div class="ability-mod" id="abConMod"></div>
                        </div>
                        <div class="ability-edit-box">
                            <div class="ability-name">INT</div>
                            <input type="number" id="abInt" min="1" max="20">
                            <div class="ability-mod" id="abIntMod"></div>
                        </div>
                        <div class="ability-edit-box">
                            <div class="ability-name">WIS</div>
                            <input type="number" id="abWis" min="1" max="20">
                            <div class="ability-mod" id="abWisMod"></div>
                        </div>
                        <div class="ability-edit-box">
                            <div class="ability-name">CHA</div>
                            <input type="number" id="abCha" min="1" max="20">
                            <div class="ability-mod" id="abChaMod"></div>
                        </div>
                    </div>

                    <h3 style="margin-top:20px; font-size:20px;">Saving Throws</h3>
                    <div class="saving-throws-grid">
                        <div class="saving-throw-row">
                            <input type="checkbox" id="saveStrProf">
                            <label for="saveStr">Strength</label>
                            <input type="number" id="saveStr">
                        </div>
                        <div class="saving-throw-row">
                            <input type="checkbox" id="saveDexProf">
                            <label for="saveDex">Dexterity</label>
                            <input type="number" id="saveDex">
                        </div>
                        <div class="saving-throw-row">
                            <input type="checkbox" id="saveConProf">
                            <label for="saveCon">Constitution</label>
                            <input type="number" id="saveCon">
                        </div>
                        <div class="saving-throw-row">
                            <input type="checkbox" id="saveIntProf">
                            <label for="saveInt">Intelligence</label>
                            <input type="number" id="saveInt">
                        </div>
                        <div class="saving-throw-row">
                            <input type="checkbox" id="saveWisProf">
                            <label for="saveWis">Wisdom</label>
                            <input type="number" id="saveWis">
                        </div>
                        <div class="saving-throw-row">
                            <input type="checkbox" id="saveChaProf">
                            <label for="saveCha">Charisma</label>
                            <input type="number" id="saveCha">
                        </div>
                    </div>
                </div>

                <!-- SKILLS TAB -->
                <div id="tab-skills" class="tab-panel">
                    <div class="skills-grid">

                        <div class="skill-row">
            
                            <label for="skillAcrobaticsProf">Acrobatics (DEX)</label>
                            <input type="number" id="skillAcrobatics" value="0">
                        </div>

                        <div class="skill-row">
                          
                            <label for="skillAnimalProf">Animal Handling (WIS)</label>
                            <input type="number" id="skillAnimal" value="0">
                        </div>

                        <div class="skill-row">
                           
                            <label for="skillArcanaProf">Arcana (INT)</label>
                            <input type="number" id="skillArcana" value="0">
                        </div>

                        <div class="skill-row">
                           
                            <label for="skillAthleticsProf">Athletics (STR)</label>
                            <input type="number" id="skillAthletics" value="0">
                        </div>

                        <div class="skill-row">
          
                            <label for="skillDeceptionProf">Deception (CHA)</label>
                            <input type="number" id="skillDeception" value="0">
                        </div>

                        <div class="skill-row">
                     
                            <label for="skillHistoryProf">History (INT)</label>
                            <input type="number" id="skillHistory" value="0">
                        </div>

                        <div class="skill-row">
           
                            <label for="skillInsightProf">Insight (WIS)</label>
                            <input type="number" id="skillInsight" value="0">
                        </div>

                        <div class="skill-row">
       
                            <label for="skillIntimidationProf">Intimidation (CHA)</label>
                            <input type="number" id="skillIntimidation" value="0">
                        </div>

                        <div class="skill-row">
            
                            <label for="skillInvestigationProf">Investigation (INT)</label>
                            <input type="number" id="skillInvestigation" value="0">
                        </div>

                        <div class="skill-row">
              
                            <label for="skillMedicineProf">Medicine (WIS)</label>
                            <input type="number" id="skillMedicine" value="0">
                        </div>

                        <div class="skill-row">
  
                            <label for="skillNatureProf">Nature (INT)</label>
                            <input type="number" id="skillNature" value="0">
                        </div>

                        <div class="skill-row">
             
                            <label for="skillPerceptionProf">Perception (WIS)</label>
                            <input type="number" id="skillPerception" value="0">
                        </div>

                        <div class="skill-row">

                            <label for="skillPerformanceProf">Performance (CHA)</label>
                            <input type="number" id="skillPerformance" value="0">
                        </div>

                        <div class="skill-row">
       
                            <label for="skillPersuasionProf">Persuasion (CHA)</label>
                            <input type="number" id="skillPersuasion" value="0">
                        </div>

                        <div class="skill-row">
                     
                            <label for="skillReligionProf">Religion (INT)</label>
                            <input type="number" id="skillReligion" value="0">
                        </div>

                        <div class="skill-row">
             
                            <label for="skillSleightProf">Sleight of Hand (DEX)</label>
                            <input type="number" id="skillSleight" value="0">
                        </div>

                        <div class="skill-row">
                
                            <label for="skillStealthProf">Stealth (DEX)</label>
                            <input type="number" id="skillStealth" value="0">
                        </div>

                        <div class="skill-row">
             
                            <label for="skillSurvivalProf">Survival (WIS)</label>
                            <input type="number" id="skillSurvival" value="0">
                        </div>

                    </div>
                </div>

                <!-- COMBAT TAB -->
                <div id="tab-combat" class="tab-panel">
                    <div class="tab-grid">
                        <div>
                            <label for="combatAC">Armor Class</label>
                            <input type="number" id="combatAC">
                        </div>
                        <div>
                            <label for="combatHP">Hit Points</label>
                            <input type="number" id="combatHP">
                        </div>
                        <div>
                            <label for="combatTempHP">Temporary HP</label>
                            <input type="number" id="combatTempHP">
                        </div>
                        <div>
                            <label for="combatInit">Initiative</label>
                            <input type="number" id="combatInit">
                        </div>
                        <div>
                            <label for="combatSpeed">Speed</label>
                            <input type="text" id="combatSpeed">
                        </div>
                        <div>
                            <label for="combatSpeedClimb">Climb Speed</label>
                            <input type="text" id="combatSpeedClimb">
                        </div>
                        <div>
                            <label for="combatSpeedSwim">Swim Speed</label>
                            <input type="text" id="combatSpeedSwim">
                        </div>
                        <div>
                            <label for="combatSpeedFly">Fly Speed</label>
                            <input type="text" id="combatSpeedFly">
                        </div>
                        <div>
                            <label for="combatHitDice">Hit Dice</label>
                            <input type="text" id="combatHitDice">
                        </div>

                        <div>
                            <label for="combatHitDiceRemaining">Hit Dice Remaining</label>
                            <input type="text" id="combatHitDiceRemaining">
                        </div>

                        <div>
                            <label for="combatProfBonus">Proficiency Bonus</label>
                            <input type="number" id="combatProfBonus">
                        </div>
                        <div>

<script type="module">

// ---------------------------------------------------------
// GUEST MODE CHECK (THIS MUST BE FIRST)
// ---------------------------------------------------------
const guestMode = localStorage.getItem("guest_mode") === "true";

// Extract ?character_id=### from URL and expose globally
const urlParams = new URLSearchParams(window.location.search);
const charIdFromUrl = urlParams.get("character_id");
if (charIdFromUrl) {
    window.CURRENT_CHARACTER_ID = parseInt(charIdFromUrl);
    console.log("Loaded character ID:", window.CURRENT_CHARACTER_ID);
}

import { apiRequest } from "/assets/api.js";


let CURRENT_ACCOUNT_ID = null;

let overlay;
let settingsMenu;
let fontMenu;
let fontList;

let META_RACES = [];
let META_CLASSES = [];
let META_BACKGROUNDS = [];

// ---------------- USER + METADATA ----------------

function getCurrentUserId() {
    const user = JSON.parse(localStorage.getItem("user"));
    return user?.id || null;
}

async function loadMetadata() {
    async function safeGet(url) {
        try {
            return await apiRequest(url, "GET");
        } catch (err) {
            console.error("Metadata load failed:", url, err);
            return [];
        }
    }

    META_RACES       = await safeGet("/meta/races");
    META_CLASSES     = await safeGet("/meta/classes");
    META_BACKGROUNDS = await safeGet("/meta/backgrounds");

    const raceSelect = document.getElementById("charRaceSelect");
    const classSelect = document.getElementById("charClassSelect");
    const backgroundSelect = document.getElementById("charBackgroundSelect");

    function populate(select, list) {
        list.forEach(item => {
            const opt = document.createElement("option");
            opt.value = item.id;
            opt.textContent = item.name;
            select.appendChild(opt);
        });
    }

    populate(raceSelect, META_RACES);
    populate(classSelect, META_CLASSES);
    populate(backgroundSelect, META_BACKGROUNDS);
}

// ---------------- ABILITY SCORE HELPERS ----------------

function abilityMod(score) {
    return Math.floor((score - 10) / 2);
}

function updateAbilityModDisplay(scoreInputId, modLabelId) {
    const val = parseInt(document.getElementById(scoreInputId).value) || 10;
    const mod = abilityMod(val);
    const modStr = mod >= 0 ? `+${mod}` : `${mod}`;
    document.getElementById(modLabelId).textContent = `Mod: ${modStr}`;
}

function wireAbilityModListeners() {
    const pairs = [
        ["abStr", "abStrMod"],
        ["abDex", "abDexMod"],
        ["abCon", "abConMod"],
        ["abInt", "abIntMod"],
        ["abWis", "abWisMod"],
        ["abCha", "abChaMod"]
    ];
    pairs.forEach(([scoreId, modId]) => {
        const input = document.getElementById(scoreId);
        input.addEventListener("input", () => updateAbilityModDisplay(scoreId, modId));
        updateAbilityModDisplay(scoreId, modId);
    });
}

// ---------------- SAFE SCORE ----------------

function safeScore(id) {
    const v = parseInt(document.getElementById(id).value);
    return isNaN(v) ? 10 : v;
}

// ---------------- CREATE CHARACTER ----------------

document.getElementById("createCharacterBtn").addEventListener("click", async () => {

    if (guestMode) {
        const payload = {
            name: document.getElementById("charNameInput").value,
            gender: document.getElementById("charGenderInput").value,
            race_id: parseInt(document.getElementById("charRaceSelect").value),
            class_id: parseInt(document.getElementById("charClassSelect").value),
            background_id: document.getElementById("charBackgroundSelect").value
                ? parseInt(document.getElementById("charBackgroundSelect").value)
                : null,

            str: safeScore("strInput"),
            dex: safeScore("dexInput"),
            con: safeScore("conInput"),
            int: safeScore("intInput"),
            wis: safeScore("wisInput"),
            cha: safeScore("chaInput")
        };

        const wrapper = document.getElementById("sheetWrapper");
        wrapper.classList.remove("hidden");
        document.querySelector(".creator-panel").classList.add("hidden");

        document.getElementById("sheetName").textContent = payload.name || "Guest Character";
        document.getElementById("sheetSubtitle").textContent =
            `Race ID: ${payload.race_id || "?"} | Class ID: ${payload.class_id || "?"}`;
        document.getElementById("sheetMeta").textContent = "Guest Mode";

        document.getElementById("ovName").value = payload.name || "";
        document.getElementById("ovPlayerName").value = "Guest";
        document.getElementById("ovGender").value = payload.gender || "";
        document.getElementById("ovRaceId").value = payload.race_id || "";
        document.getElementById("ovClassId").value = payload.class_id || "";
        document.getElementById("ovBackgroundId").value = payload.background_id || "";
        document.getElementById("ovLevel").value = 1;
        document.getElementById("ovAlignment").value = "";
        document.getElementById("ovXP").value = 0;

        document.getElementById("abStr").value = payload.str;
        document.getElementById("abDex").value = payload.dex;
        document.getElementById("abCon").value = payload.con;
        document.getElementById("abInt").value = payload.int;
        document.getElementById("abWis").value = payload.wis;
        document.getElementById("abCha").value = payload.cha;

        wireAbilityModListeners();
        return;
    }

    const payload = {
        account_id: localStorage.getItem("account_id"),
        name: document.getElementById("charNameInput").value,
        gender: document.getElementById("charGenderInput").value,
        race_id: parseInt(document.getElementById("charRaceSelect").value),
        class_id: parseInt(document.getElementById("charClassSelect").value),
        background_id: document.getElementById("charBackgroundSelect").value
            ? parseInt(document.getElementById("charBackgroundSelect").value)
            : null,

        str: safeScore("strInput"),
        dex: safeScore("dexInput"),
        con: safeScore("conInput"),
        int: safeScore("intInput"),
        wis: safeScore("wisInput"),
        cha: safeScore("chaInput"),

        experience: 0,
        proficiency_bonus: 2
    };

    try {
        const result = await apiRequest("/characters/create", "POST", payload);

        if (result.success) {
            window.location.href = `/assets/create_character.html?character_id=${result.character_id}`;
        }
    } catch (err) {
        console.error("Character creation failed:", err);
        alert("Failed to create character.");
    }
});

// ---------------- LOAD CHARACTER (REAL SHEET ENDPOINT) ----------------

async function loadCharacter(charId) {
    if (guestMode) return;
    if (!charId) return;

    try {
        const data = await apiRequest(`/characters/${charId}/sheet`, "GET");

        wireAbilityModListeners();

        document.querySelector(".creator-panel").classList.add("hidden");
        document.getElementById("sheetWrapper").classList.remove("hidden");
    } catch (err) {
        console.error(err);
        alert("Failed to load character.");
    }
}

// ---------------- TAB SWITCHING ----------------
function wireTabs() {
    const tabs = document.querySelectorAll(".sheet-tab");
    const panels = document.querySelectorAll(".tab-panel");

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            const target = tab.dataset.tab;

            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            panels.forEach(p => p.classList.remove("active"));
            const panel = document.getElementById(`tab-${target}`);
            if (panel) panel.classList.add("active");
        });
    });
}

// ---------------- STARTUP ----------------

async function startup() {
    if (guestMode) {
        document.querySelector(".creator-panel").classList.remove("hidden");
        document.getElementById("sheetWrapper").classList.add("hidden");

        await loadMetadata();
        const saveBtn = document.getElementById("saveCharacterBtn");
        saveBtn.disabled = true;
        saveBtn.innerText = "Guest Mode (Cannot Save)";
        return;
    }

    CURRENT_ACCOUNT_ID = getCurrentUserId();
    if (!CURRENT_ACCOUNT_ID) {
        window.location.href = "/assets/login.html";
        return;
    }

    await loadMetadata();

    if (window.CURRENT_CHARACTER_ID) {
        await loadCharacter(window.CURRENT_CHARACTER_ID);
    } else {
        document.querySelector(".creator-panel").classList.remove("hidden");
        document.getElementById("sheetWrapper").classList.add("hidden");
    }
}

// ---------------- NAVIGATION ----------------

document.getElementById("backToListBtn").addEventListener("click", () => {
    window.location.href = "/assets/characters.html";
});

// ---------------- SETTINGS + FONT MENUS ----------------

window.addEventListener("DOMContentLoaded", () => {

    overlay = document.getElementById("overlay");
    settingsMenu = document.getElementById("settingsMenu");
    fontMenu = document.getElementById("fontMenu");
    fontList = document.getElementById("fontList");

    overlay.style.display = "none";
    settingsMenu.style.display = "none";
    fontMenu.style.display = "none";

    document.getElementById("settingsButton").addEventListener("click", (e) => {
        if (!e.isTrusted) return;
        overlay.style.display = "block";
        settingsMenu.style.display = "flex";
    });

    document.getElementById("closeSettingsBtn").addEventListener("click", () => {
        settingsMenu.style.display = "none";
        overlay.style.display = "none";
    });

    document.getElementById("logoutBtn2").addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "/assets/login.html";
    });

    document.getElementById("openFontMenuBtn").addEventListener("click", (e) => {
        if (!e.isTrusted) return;
        settingsMenu.style.display = "none";
        fontMenu.style.display = "flex";
        loadFontList();
    });

    document.getElementById("closeFontMenuBtn").addEventListener("click", () => {
        fontMenu.style.display = "none";
        overlay.style.display = "none";
    });

    wireTabs();
    startup();
});

// Load fonts dynamically
function loadFontList() {
    const fonts = ["Firlest", "PfefferMediaeval", "Gondens", "ComicSans"];

    fontList.innerHTML = "";

    fonts.forEach(font => {
        const btn = document.createElement("button");
        btn.textContent = font;
        btn.style.fontFamily = font;

        btn.addEventListener("click", () => {
            document.documentElement.style.setProperty("--global-font", font);
        });

        fontList.appendChild(btn);
    });
}

</script>

    <script type="module" src="/assets/character_load.js"></script>
    <script type="module" src="/assets/character_save.js"></script>
