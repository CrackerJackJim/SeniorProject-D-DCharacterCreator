<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <link rel="stylesheet" href="/assets/style.css">

    <style>
        body {
            background: url('/assets/images/Background.jpg') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>

<body>

<!-- MAIN RESET MENU -->
<div class="reset-container">
    <h1>Password Reset</h1>

    <input id="username" placeholder="Enter Username">
    <input id="email" placeholder="Enter Email">

    <p id="resetMessage" class="error"></p>

    <button id="submitUser">Submit</button>
    <button id="exitReset">Exit</button>
</div>

<!-- SUBMENU OVERLAY -->
<div class="overlay" id="overlay">
    <div class="submenu">
        <h2>Enter New Password</h2>

        <input id="newPass" type="password" placeholder="New Password">
        <input id="confirmPass" type="password" placeholder="Confirm Password (8+ chars)">

        <p id="passMessage" class="error"></p>

        <button id="submitPass">Submit</button>
        <button id="exitSubmenu">Exit</button>
    </div>
</div>

<!-- ONLY THIS SCRIPT SHOULD EXIST -->
<script type="module" src="/assets/password_reset.js"></script>

</body>
</html>
