<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Register</title>
    <link rel="stylesheet" href="/assets/style.css">

    <style>
        :root { --global-font: 'Firlest'; }

        body {
            font-family: var(--global-font, 'Firlest');
            background-color: #1b1510;
            margin: 0;
            color: #f5e6c8;
        }

        .register-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        /* MAIN PANEL */
        .auth-container {
            width: 820px;
            max-width: 95%;
            background: url('/assets/images/Selection.jpg') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 24px;
            box-shadow: 0 0 55px rgba(0,0,0,0.75);
            padding: 70px 70px 40px;
            color: #2b1d0f;
            position: relative;
        }

        .auth-container h1 {
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 54px;
            text-align: center;
        }

        .auth-container input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 3px solid #5a3e1b;
            background: #c8b48a;
            color: #2b1d0f;
            font-size: 22px;
            font-family: var(--global-font), serif;
            box-sizing: border-box;
        }

        .help-row {
            display: flex;
            justify-content: flex-start;
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .help-btn {
            padding: 8px 16px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #5a3e1b;
            background: #c8b48a;
            cursor: pointer;
            font-family: var(--global-font), serif;
        }

        .help-btn:hover {
            background: #d6c49a;
        }

        .auth-container button {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            border-radius: 12px;
            border: 3px solid #5a3e1b;
            background-color: #c8b48a;
            color: #2b1d0f;
            font-size: 28px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--global-font), serif;
        }

        .auth-container button:hover {
            background-color: #d6c49a;
        }

        /* UPDATED ERROR COLOR */
        .error {
            color: #b30000; /* bright red */
            font-size: 22px;
            min-height: 26px;
            margin-top: 8px;
            text-align: center;
        }

        .success {
            color: #0a5a0a;
            font-size: 22px;
            min-height: 26px;
            margin-top: 8px;
            text-align: center;
        }

        .auth-container p {
            margin-top: 14px;
            font-size: 20px;
            text-align: center;
            color: #2b1d0f;
        }

        .auth-container a {
            color: #3b2612;
            text-decoration: underline;
        }

        .auth-container a:hover {
            color: #1f1207;
        }

        /* HELP PANEL */
        .help-panel {
            position: fixed;
            top: 50%;
            right: -600px;
            transform: translateY(-50%);
            width: 420px;
            background: url('/assets/images/Selection.jpg') no-repeat center center;
            background-size: 100% 100%;
            border-radius: 24px;
            box-shadow: 0 0 45px rgba(0,0,0,0.8);
            padding: 50px 40px;
            transition: right 0.35s ease;
            z-index: 9500;
            color: #2b1d0f;
        }

        .help-panel.open {
            right: 220px;
        }

        .help-panel h2 {
            margin-top: 0;
            font-size: 34px;
            text-align: center;
            margin-bottom: 20px;
        }

        .help-panel ul {
            font-size: 22px;
            line-height: 1.7;
            padding-left: 20px;
        }

        .help-panel .example {
            margin-top: 24px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="register-wrapper">
    <div class="auth-container">
        <h1>Create Account</h1>

        <input id="username" type="text" placeholder="Username" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password (8+ chars, symbol & number)" maxlength="72" required>

        <div class="help-row">
            <button class="help-btn" id="helpBtn">Help</button>
        </div>

        <button id="registerBtn">Register</button>

        <p id="error" class="error"></p>
        <p id="success" class="success"></p>

        <p>
            Already have an account?
            <a href="/assets/login.html">Login here</a>
        </p>
    </div>
</div>

<div class="help-panel" id="helpPanel">
    <h2>Password Requirements</h2>
    <ul>
        <li>Password needs 8 characters or more</li>
        <li>Password must include symbols like # or $</li>
        <li>Password must include a number</li>
    </ul>

    <div class="example">
        Example: <br> MyPassword#1
    </div>
</div>

<script type="module" src="/assets/api.js"></script>

<script type="module">
    import { apiRequest } from "/assets/api.js";

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const registerBtn = document.getElementById("registerBtn");

    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");

    registerBtn.addEventListener("click", async () => {
        errorEl.textContent = "";
        successEl.textContent = "";

        const username = usernameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !email || !password) {
            errorEl.textContent = "All fields are required.";
            return;
        }

        try {
            const result = await apiRequest("/register", "POST", {
                username,
                email,
                password
            });

            localStorage.setItem("user", JSON.stringify({
                id: result.user_id,
                username: result.username,
                email: result.email
            }));

            localStorage.setItem("account_id", result.user_id);

            successEl.textContent = "Account created! Redirecting...";

            setTimeout(() => {
                window.location.href = "/assets/characters.html";
            }, 800);

        } catch (err) {
            errorEl.textContent = err.message || "Registration failed.";
        }
    });

    const helpBtn = document.getElementById("helpBtn");
    const helpPanel = document.getElementById("helpPanel");

    helpBtn.addEventListener("click", () => {
        helpPanel.classList.toggle("open");
    });
</script>

</body>
</html>
