<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D Register</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div class="auth-container">
    <h1>Create Account</h1>

    <input id="username" type="text" placeholder="Username" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password (8+ chars)" maxlength="72" required>

    <button id="registerBtn">Register</button>

    <p id="error" class="error"></p>
    <p id="success" class="success"></p>

    <p>
        Already have an account?
        <a href="/assets/login.html">Login here</a>
    </p>
</div>

<script type="module" src="/assets/api.js"></script>

<script type="module">
    import { apiRequest } from "/assets/api.js";

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const registerBtn = document.getElementById("registerBtn");

    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");

    registerBtn.addEventListener("click", async () => {
        errorEl.textContent = "";
        successEl.textContent = "";

        const username = usernameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !email || !password) {
            errorEl.textContent = "All fields are required.";
            return;
        }

        try {
            const result = await apiRequest("/register", "POST", {
                username,
                email,
                password
            });

            localStorage.setItem("user", JSON.stringify({
                id: result.user_id,
                username: result.username,
                email: result.email
            }));

            localStorage.setItem("account_id", result.user_id);

            successEl.textContent = "Account created! Redirecting...";

            setTimeout(() => {
                window.location.href = "/assets/characters.html";
            }, 800);

        } catch (err) {
            errorEl.textContent = err.message || "Registration failed.";
        }
    });
</script>

</body>
</html>
