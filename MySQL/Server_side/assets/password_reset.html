<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

<div class="reset-wrapper">
    <div class="reset-container">
        <h1>Password Reset</h1>

        <input id="username" placeholder="Enter Username">
        <input id="email" placeholder="Enter Email">

        <p id="resetMessage" class="error"></p>
        <p id="resetSuccess" class="success"></p>

        <button id="submitUser">Submit</button>
        <button id="exitReset">Exit</button>
    </div>
</div>

<!-- HELP PANEL -->
<div class="help-panel" id="helpPanel">
    <h2>Password Requirements</h2>
    <ul>
        <li>Password needs 8 characters or more</li>
        <li>Password must include symbols like # or $</li>
        <li>Password must include a number</li>
    </ul>

    <div class="example">
        Example: <br> MyPassword#1
    </div>
</div>

<!-- SUBMENU OVERLAY -->
<div class="overlay" id="overlay">
    <div class="submenu">
        <h2>Enter New Password</h2>

        <input id="newPass" type="password" placeholder="New Password (8+ Chars, Symbol & Number)">
        <input id="confirmPass" type="password" placeholder="Confirm Password (8+ Chars, Symbol & Number)">

        <div class="submenu-help-row">
            <button class="help-btn" id="helpBtn">Help</button>
        </div>

        <p id="passMessage" class="error"></p>
        <p id="passSuccess" class="success"></p>

        <button id="submitPass">Submit</button>
        <button id="exitSubmenu">Exit</button>
    </div>
</div>

<script type="module" src="/assets/password_reset.js"></script>

</body>
</html>
